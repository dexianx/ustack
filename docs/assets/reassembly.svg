on:k18 12s linear infinite}@media (prefers-reduced-motion:reduce){.loop{animation-play-state:paused!important;animation-delay:-7.6s!important}.once{animation:none!important}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#d9cfbe"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#d9cfbe" stroke-width="1.2"/></pattern></defs><rect width="960" height="540" fill="#f4efe6"/><rect width="960" height="540" fill="url(#dots)"/><path d="M14 28V14H28" fill="none" stroke="#6e675b" stroke-width="1"/><path d="M946 28V14H932" fill="none" stroke="#6e675b" stroke-width="1"/><path d="M14 512V526H28" fill="none" stroke="#6e675b" stroke-width="1"/><path d="M946 512V526H932" fill="none" stroke="#6e675b" stroke-width="1"/><text class="s" x="40.0" y="50.0" font-size="10.5" font-weight="600" fill="#cf4520" text-anchor="start" letter-spacing="1.6">FIG. 4</text><text class="r" x="40.0" y="80.0" font-size="25" font-weight="600" fill="#23201b" text-anchor="start">Reassembly without a queue</text><text class="s" x="40.0" y="102.0" font-size="13.5" font-weight="400" fill="#6e675b" text-anchor="start">The receive buffer is a ring. Out-of-order data goes straight to its final offset.</text><line x1="40.0" y1="118.0" x2="920.0" y2="118.0" stroke="#c9bea9" stroke-width="1"/><circle cx="300" cy="330" r="188" fill="none" stroke="#d9cfbe" stroke-width="1"/><path d="M302.3 164.0A166 166 0 0 1 415.7 211.0L361.4 266.9A88 88 0 0 0 301.2 242.0Z" fill="#ebe3d4" stroke="#c9bea9" stroke-width="1"/><path d="M419.0 214.3A166 166 0 0 1 466.0 327.7L388.0 328.8A88 88 0 0 0 363.1 268.6Z" fill="#ebe3d4" stroke="#c9bea9" stroke-width="1"/><path d="M466.0 332.3A166 166 0 0 1 419.0 445.7L363.1 391.4A88 88 0 0 0 388.0 331.2Z" fill="#ebe3d4" stroke="#c9bea9" stroke-width="1"/><path d="M415.7 449.0A166 166 0 0 1 302.3 496.0L301.2 418.0A88 88 0 0 0 361.4 393.1Z" fill="#ebe3d4" stroke="#c9bea9" stroke-width="1"/><path d="M297.7 496.0A166 166 0 0 1 184.3 449.0L238.6 393.1A88 88 0 0 0 298.8 418.0Z" fill="#ebe3d4" stroke="#c9bea9" stroke-width="1"/><path d="M181.0 445.7A166 166 0 0 1 134.0 332.3L212.0 331.2A88 88 0 0 0 236.9 391.4Z" fill="#ebe3d4" stroke="#c9bea9" stroke-width="1"/><path d="M134.0 327.7A166 166 0 0 1 181.0 214.3L236.9 268.6A88 88 0 0 0 212.0 328.8Z" fill="#ebe3d4" stroke="#c9bea9" stroke-width="1"/><path d="M184.3 211.0A166 166 0 0 1 297.7 164.0L298.8 242.0A88 88 0 0 0 238.6 266.9Z" fill="#ebe3d4" stroke="#c9bea9" stroke-width="1"/><path class="k1 loop" d="M302.3 164.0A166 166 0 0 1 415.7 211.0L361.4 266.9A88 88 0 0 0 301.2 242.0Z" fill="#cf4520"/><g class="k2 loop"><rect width="22" height="10" rx="1" fill="#cf4520"/></g><path class="k3 loop" d="M419.0 214.3A166 166 0 0 1 466.0 327.7L388.0 328.8A88 88 0 0 0 363.1 268.6Z" fill="#cf4520"/><g class="k4 loop"><rect width="22" height="10" rx="1" fill="#cf4520"/></g><path class="k5 loop" d="M415.7 449.0A166 166 0 0 1 302.3 496.0L301.2 418.0A88 88 0 0 0 361.4 393.1Z" fill="#2c4a78"/><g class="k6 loop"><rect width="22" height="10" rx="1" fill="#2c4a78"/></g><path class="k7 loop" d="M297.7 496.0A166 166 0 0 1 184.3 449.0L238.6 393.1A88 88 0 0 0 298.8 418.0Z" fill="#2c4a78"/><g class="k8 loop"><rect width="22" height="10" rx="1" fill="#2c4a78"/></g><path class="k9 loop" d="M181.0 445.7A166 166 0 0 1 134.0 332.3L212.0 331.2A88 88 0 0 0 236.9 391.4Z" fill="#2c4a78"/><g class="k10 loop"><rect width="22" height="10" rx="1" fill="#2c4a78"/></g><path class="k11 loop" d="M466.0 332.3A166 166 0 0 1 419.0 445.7L363.1 391.4A88 88 0 0 0 388.0 331.2Z" fill="#b47a12"/><g class="k12 loop"><rect width="22" height="10" rx="1" fill="#b47a12"/></g><text class="r" x="349.0" y="216.7" font-size="15" font-weight="600" fill="#23201b" text-anchor="middle">1</text><text class="r" x="418.3" y="286.0" font-size="15" font-weight="600" fill="#23201b" text-anchor="middle">2</text><text class="r" x="418.3" y="384.0" font-size="15" font-weight="600" fill="#23201b" text-anchor="middle">3</text><text class="r" x="349.0" y="453.3" font-size="15" font-weight="600" fill="#23201b" text-anchor="middle">4</text><text class="r" x="251.0" y="453.3" font-size="15" font-weight="600" fill="#23201b" text-anchor="middle">5</text><text class="r" x="181.7" y="384.0" font-size="15" font-weight="600" fill="#23201b" text-anchor="middle">6</text><text class="r" x="181.7" y="286.0" font-size="15" font-weight="600" fill="#23201b" text-anchor="middle">7</text><text class="r" x="251.0" y="216.7" font-size="15" font-weight="600" fill="#23201b" text-anchor="middle">8</text><g class="k13 loop" style="transform-origin:300px 330px"><line x1="300.0" y1="330.0" x2="496.0" y2="330.0" stroke="#23201b" stroke-width="2.2"/><circle cx="496" cy="330" r="4" fill="#23201b"/></g><circle cx="300" cy="330" r="34" fill="#f4efe6" stroke="#23201b" stroke-width="1.2"/><text class="m" x="300.0" y="329.0" font-size="11" font-weight="600" fill="#23201b" text-anchor="middle">rcv_nxt</text><text class="s" x="300.0" y="344.0" font-size="10" font-weight="400" fill="#6e675b" text-anchor="middle">hand</text><g class="k14 loop"><path d="M421.4 460.2A178 178 0 0 1 122.1 336.2" fill="none" stroke="#2c4a78" stroke-width="3"/><text class="s" x="496.0" y="462.0" font-size="13" font-weight="700" fill="#2c4a78" text-anchor="start">SACK 4–6</text></g><text class="s" x="150.0" y="136.0" font-size="10.5" font-weight="600" fill="#6e675b" text-anchor="start" letter-spacing="1.6">FROM THE NETWORK</text><line x1="150.0" y1="146.0" x2="450.0" y2="146.0" stroke="#c9bea9" stroke-width="1" stroke-dasharray="2 4"/><g class="k15 loop"><text class="r" x="560.0" y="202.0" font-size="30" font-weight="600" fill="#cf4520" text-anchor="start">1</text><text class="r" x="596.0" y="190.0" font-size="15" font-weight="600" fill="#23201b" text-anchor="start">In-order data arrives.</text><text class="s" x="596.0" y="210.0" font-size="12" font-weight="400" fill="#6e675b" text-anchor="start">rcv_nxt moves one segment at a time.</text></g><g class="k16 loop"><text class="r" x="560.0" y="278.0" font-size="30" font-weight="600" fill="#cf4520" text-anchor="start">2</text><text class="r" x="596.0" y="266.0" font-size="15" font-weight="600" fill="#23201b" text-anchor="start">Segment 3 is missing.</text><text class="s" x="596.0" y="286.0" font-size="12" font-weight="400" fill="#6e675b" text-anchor="start">4, 5 and 6 land at their own offsets. The ACK says SACK 4–6.</text></g><g class="k17 loop"><text class="r" x="560.0" y="354.0" font-size="30" font-weight="600" fill="#cf4520" text-anchor="start">3</text><text class="r" x="596.0" y="342.0" font-size="15" font-weight="600" fill="#23201b" text-anchor="start">The retransmission of 3 arrives.</text><text class="s" x="596.0" y="362.0" font-size="12" font-weight="400" fill="#6e675b" text-anchor="start">rcv_nxt sweeps across four segments at once.</text></g><g class="k18 loop"><text class="r" x="560.0" y="430.0" font-size="30" font-weight="600" fill="#cf4520" text-anchor="start">4</text><text class="r" x="596.0" y="418.0" font-size="15" font-weight="600" fill="#23201b" text-anchor="start">The app reads.</text><text class="s" x="596.0" y="438.0" font-size="12" font-weight="400" fill="#6e675b" text-anchor="start">The space goes back into the advertised window.</text></g><text class="s" x="560.0" y="494.0" font-size="12" font-weight="400" fill="#6e675b" text-anchor="start">No segment list and no extra copy.</text><text class="s" x="560.0" y="512.0" font-size="12" font-weight="400" fill="#6e675b" text-anchor="start">SACK ranges live in a small sorted interval set.</text></svg>
