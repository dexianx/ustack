<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="The life of one received packet inside ustack"><style>.s{font-family:'Avenir Next','Segoe UI Variable','Segoe UI','Helvetica Neue',sans-serif}.r{font-family:'Iowan Old Style','Charter','Bitstream Charter','Palatino Linotype',Georgia,serif}.m{font-family:'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace}@keyframes k1{0.000%{fill:#f4efe6}4.000%{fill:#f4efe6}5.000%{fill:#cf4520}12.500%{fill:#cf4520}15.000%{fill:#f4efe6}100.000%{fill:#f4efe6}}.k1{animation:k1 10s linear infinite}@keyframes k2{0.000%{fill:#f4efe6}13.000%{fill:#f4efe6}14.000%{fill:#cf4520}21.500%{fill:#cf4520}24.000%{fill:#f4efe6}100.000%{fill:#f4efe6}}.k2{animation:k2 10s linear infinite}@keyframes k3{0.000%{fill:#f4efe6}22.000%{fill:#f4efe6}23.000%{fill:#cf4520}30.500%{fill:#cf4520}33.000%{fill:#f4efe6}100.000%{fill:#f4efe6}}.k3{animation:k3 10s linear infinite}@keyframes k4{0.000%{fill:#f4efe6}31.000%{fill:#f4efe6}32.000%{fill:#cf4520}39.500%{fill:#cf4520}42.000%{fill:#f4efe6}100.000%{fill:#f4efe6}}.k4{animation:k4 10s linear infinite}@keyframes k5{0.000%{fill:#f4efe6}40.000%{fill:#f4efe6}41.000%{fill:#cf4520}48.500%{fill:#cf4520}51.000%{fill:#f4efe6}100.000%{fill:#f4efe6}}.k5{animation:k5 10s linear infinite}@keyframes k6{0.000%{fill:#f4efe6}49.000%{fill:#f4efe6}50.000%{fill:#cf4520}57.500%{fill:#cf4520}60.000%{fill:#f4efe6}100.000%{fill:#f4efe6}}.k6{animation:k6 10s linear infinite}@keyframes k7{0.000%{fill:#f4efe6}58.000%{fill:#f4efe6}59.000%{fill:#cf4520}66.500%{fill:#cf4520}69.000%{fill:#f4efe6}100.000%{fill:#f4efe6}}.k7{animation:k7 10s linear infinite}@keyframes k8{0.000%{transform:translate(57px,152px);opacity:0}2.000%{transform:translate(57px,152px);opacity:0}4.000%{transform:translate(57px,152px);opacity:1}13.000%{transform:translate(192px,152px);opacity:1}22.000%{transform:translate(327px,152px);opacity:1}31.000%{transform:translate(462px,152px);opacity:1}40.000%{transform:translate(597px,152px);opacity:1}49.000%{transform:translate(732px,152px);opacity:1}58.000%{transform:translate(867px,152px);opacity:1}66.000%{transform:translate(867px,152px);opacity:0}100.000%{transform:translate(867px,152px);opacity:0}}.k8{animation:k8 10s cubic-bezier(.22,1,.36,1) infinite}@keyframes k9{0.000%{fill:#f4efe6}70.000%{fill:#f4efe6}71.000%{fill:#2e6a4f}77.500%{fill:#2e6a4f}80.000%{fill:#f4efe6}100.000%{fill:#f4efe6}}.k9{animation:k9 10s linear infinite}@keyframes k10{0.000%{fill:#f4efe6}78.000%{fill:#f4efe6}79.000%{fill:#2e6a4f}85.500%{fill:#2e6a4f}88.000%{fill:#f4efe6}100.000%{fill:#f4efe6}}.k10{animation:k10 10s linear infinite}@keyframes k11{0.000%{fill:#f4efe6}86.000%{fill:#f4efe6}87.000%{fill:#2e6a4f}93.500%{fill:#2e6a4f}96.000%{fill:#f4efe6}100.000%{fill:#f4efe6}}.k11{animation:k11 10s linear infinite}@keyframes k12{0.000%{transform:translate(869px,294px);opacity:0}68.000%{transform:translate(869px,294px);opacity:0}70.000%{transform:translate(869px,294px);opacity:1}78.000%{transform:translate(734px,294px);opacity:1}86.000%{transform:translate(599px,294px);opacity:1}94.000%{transform:translate(599px,294px);opacity:0}100.000%{transform:translate(599px,294px);opacity:0}}.k12{animation:k12 10s cubic-bezier(.22,1,.36,1) infinite}@media (prefers-reduced-motion:reduce){.loop{animation-play-state:paused!important;animation-delay:-3.6s!important}.once{animation:none!important}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#d9cfbe"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#d9cfbe" stroke-width="1.2"/></pattern></defs><rect width="960" height="400" fill="#f4efe6"/><rect width="960" height="400" fill="url(#dots)"/><path d="M14 28V14H28" fill="none" stroke="#6e675b" stroke-width="1"/><path d="M946 28V14H932" fill="none" stroke="#6e675b" stroke-width="1"/><path d="M14 372V386H28" fill="none" stroke="#6e675b" stroke-width="1"/><path d="M946 372V386H932" fill="none" stroke="#6e675b" stroke-width="1"/><text class="s" x="40.0" y="50.0" font-size="10.5" font-weight="600" fill="#cf4520" text-anchor="start" letter-spacing="1.6">FIG. 2</text><text class="r" x="40.0" y="80.0" font-size="25" font-weight="600" fill="#23201b" text-anchor="start">Life of a packet</text><text class="s" x="40.0" y="102.0" font-size="13.5" font-weight="400" fill="#6e675b" text-anchor="start">One segment in. Zero heap allocations. One coalesced ACK out.</text><line x1="40.0" y1="118.0" x2="920.0" y2="118.0" stroke="#c9bea9" stroke-width="1"/><line x1="70.0" y1="178.0" x2="880.0" y2="178.0" stroke="#23201b" stroke-width="1.2"/><text class="s" x="70.0" y="150.0" font-size="10" font-weight="600" fill="#6e675b" text-anchor="middle" letter-spacing="1.6">01</text><rect class="k1 loop" x="63" y="171" width="14" height="14" stroke="#23201b" stroke-width="1.2"/><text class="m" x="70.0" y="210.0" font-size="13.5" font-weight="600" fill="#23201b" text-anchor="middle">readv()</text><text class="s" x="70.0" y="228.0" font-size="11" font-weight="400" fill="#6e675b" text-anchor="middle">≤ 256 per batch</text><text class="s" x="205.0" y="150.0" font-size="10" font-weight="600" fill="#6e675b" text-anchor="middle" letter-spacing="1.6">02</text><rect class="k2 loop" x="198" y="171" width="14" height="14" stroke="#23201b" stroke-width="1.2"/><text class="s" x="205.0" y="210.0" font-size="13.5" font-weight="600" fill="#23201b" text-anchor="middle">IPv4</text><text class="s" x="205.0" y="228.0" font-size="11" font-weight="400" fill="#6e675b" text-anchor="middle">length · checksum · address</text><text class="s" x="340.0" y="150.0" font-size="10" font-weight="600" fill="#6e675b" text-anchor="middle" letter-spacing="1.6">03</text><rect class="k3 loop" x="333" y="171" width="14" height="14" stroke="#23201b" stroke-width="1.2"/><text class="s" x="340.0" y="210.0" font-size="13.5" font-weight="600" fill="#23201b" text-anchor="middle">TCP checksum</text><text class="s" x="340.0" y="228.0" font-size="11" font-weight="400" fill="#6e675b" text-anchor="middle">pseudo-header</text><text class="s" x="475.0" y="150.0" font-size="10" font-weight="600" fill="#6e675b" text-anchor="middle" letter-spacing="1.6">04</text><rect class="k4 loop" x="468" y="171" width="14" height="14" stroke="#23201b" stroke-width="1.2"/><text class="s" x="475.0" y="210.0" font-size="13.5" font-weight="600" fill="#23201b" text-anchor="middle">lookup</text><text class="s" x="475.0" y="228.0" font-size="11" font-weight="400" fill="#6e675b" text-anchor="middle">hot cache, then SipHash</text><text class="s" x="610.0" y="150.0" font-size="10" font-weight="600" fill="#6e675b" text-anchor="middle" letter-spacing="1.6">05</text><rect class="k5 loop" x="603" y="171" width="14" height="14" stroke="#23201b" stroke-width="1.2"/><text class="s" x="610.0" y="210.0" font-size="13.5" font-weight="600" fill="#23201b" text-anchor="middle">RFC 9293</text><text class="s" x="610.0" y="228.0" font-size="11" font-weight="400" fill="#6e675b" text-anchor="middle">PAWS · window · state</text><text class="s" x="745.0" y="150.0" font-size="10" font-weight="600" fill="#6e675b" text-anchor="middle" letter-spacing="1.6">06</text><rect class="k6 loop" x="738" y="171" width="14" height="14" stroke="#23201b" stroke-width="1.2"/><text class="s" x="745.0" y="210.0" font-size="13.5" font-weight="600" fill="#23201b" text-anchor="middle">ring copy</text><text class="s" x="745.0" y="228.0" font-size="11" font-weight="400" fill="#6e675b" text-anchor="middle">one copy, final offset</text><text class="s" x="880.0" y="150.0" font-size="10" font-weight="600" fill="#6e675b" text-anchor="middle" letter-spacing="1.6">07</text><rect class="k7 loop" x="873" y="171" width="14" height="14" stroke="#23201b" stroke-width="1.2"/><text class="m" x="880.0" y="210.0" font-size="13.5" font-weight="600" fill="#23201b" text-anchor="middle">on_readable()</text><text class="s" x="880.0" y="228.0" font-size="11" font-weight="400" fill="#6e675b" text-anchor="middle">the app runs</text><g class="k8 loop"><rect width="26" height="10" rx="1" fill="#cf4520"/></g><line x1="880.0" y1="240.0" x2="880.0" y2="318.0" stroke="#c9bea9" stroke-width="1" stroke-dasharray="3 3"/><line x1="610.0" y1="318.0" x2="880.0" y2="318.0" stroke="#2e6a4f" stroke-width="1.2"/><rect class="k9 loop" x="873" y="311" width="14" height="14" stroke="#2e6a4f" stroke-width="1.2"/><text class="m" x="880.0" y="348.0" font-size="13.5" font-weight="600" fill="#23201b" text-anchor="middle">stack_flush()</text><text class="s" x="880.0" y="366.0" font-size="11" font-weight="400" fill="#6e675b" text-anchor="middle">per dirty connection</text><rect class="k10 loop" x="738" y="311" width="14" height="14" stroke="#2e6a4f" stroke-width="1.2"/><text class="s" x="745.0" y="348.0" font-size="13.5" font-weight="600" fill="#23201b" text-anchor="middle">ACK</text><text class="s" x="745.0" y="366.0" font-size="11" font-weight="400" fill="#6e675b" text-anchor="middle">coalesced, with SACK</text><rect class="k11 loop" x="603" y="311" width="14" height="14" stroke="#2e6a4f" stroke-width="1.2"/><text class="m" x="610.0" y="348.0" font-size="13.5" font-weight="600" fill="#23201b" text-anchor="middle">writev()</text><text class="s" x="610.0" y="366.0" font-size="11" font-weight="400" fill="#6e675b" text-anchor="middle">back to the kernel</text><g class="k12 loop"><rect width="22" height="9" rx="1" fill="#2e6a4f"/></g><text class="r" x="70.0" y="300.0" font-size="17" font-weight="600" fill="#23201b" text-anchor="start">Zero heap allocations per packet.</text><text class="s" x="70.0" y="322.0" font-size="12.5" font-weight="400" fill="#6e675b" text-anchor="start">The core never calls the OS.</text><text class="s" x="70.0" y="340.0" font-size="12.5" font-weight="400" fill="#6e675b" text-anchor="start">The driver gives it bytes and a clock.</text></svg>
