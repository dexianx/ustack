<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="A tail loss probe recovers in milliseconds instead of waiting for the RTO"><style>.s{font-family:'Avenir Next','Segoe UI Variable','Segoe UI','Helvetica Neue',sans-serif}.r{font-family:'Iowan Old Style','Charter','Bitstream Charter','Palatino Linotype',Georgia,serif}.m{font-family:'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace}@keyframes k1{0.000%{opacity:0}3.636%{opacity:0}6.364%{opacity:1}90.909%{opacity:1}93.636%{opacity:0}100.000%{opacity:0}}.k1{animation:k1 11s linear infinite}@keyframes k2{0.000%{opacity:0}3.636%{opacity:0}6.364%{opacity:1}90.909%{opacity:1}93.636%{opacity:0}100.000%{opacity:0}}.k2{animation:k2 11s linear infinite}@keyframes k3{0.000%{transform:scaleX(0)}7.273%{transform:scaleX(0)}21.818%{transform:scaleX(1)}90.909%{transform:scaleX(1)}100.000%{transform:scaleX(0)}}.k3{animation:k3 11s cubic-bezier(.22,1,.36,1) infinite}@keyframes k4{0.000%{opacity:0}9.091%{opacity:0}11.818%{opacity:1}90.909%{opacity:1}93.636%{opacity:0}100.000%{opacity:0}}.k4{animation:k4 11s linear infinite}@keyframes k5{0.000%{opacity:0}21.818%{opacity:0}24.545%{opacity:1}90.909%{opacity:1}93.636%{opacity:0}100.000%{opacity:0}}.k5{animation:k5 11s linear infinite}@keyframes k6{0.000%{opacity:0}28.182%{opacity:0}30.909%{opacity:1}90.909%{opacity:1}93.636%{opacity:0}100.000%{opacity:0}}.k6{animation:k6 11s linear infinite}@keyframes k7{0.000%{transform:scaleX(0)}7.273%{transform:scaleX(0)}78.182%{transform:scaleX(1)}90.909%{transform:scaleX(1)}100.000%{transform:scaleX(0)}}.k7{animation:k7 11s linear infinite}@keyframes k8{0.000%{opacity:0}78.182%{opacity:0}80.909%{opacity:1}90.909%{opacity:1}93.636%{opacity:0}100.000%{opacity:0}}.k8{animation:k8 11s linear infinite}@media (prefers-reduced-motion:reduce){.loop{animation-play-state:paused!important;animation-delay:-9.8s!important}.once{animation:none!important}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#d9cfbe"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#d9cfbe" stroke-width="1.2"/></pattern></defs><rect width="960" height="420" fill="#f4efe6"/><rect width="960" height="420" fill="url(#dots)"/><path d="M14 28V14H28" fill="none" stroke="#6e675b" stroke-width="1"/><path d="M946 28V14H932" fill="none" stroke="#6e675b" stroke-width="1"/><path d="M14 392V406H28" fill="none" stroke="#6e675b" stroke-width="1"/><path d="M946 392V406H932" fill="none" stroke="#6e675b" stroke-width="1"/><text class="s" x="40.0" y="50.0" font-size="10.5" font-weight="600" fill="#cf4520" text-anchor="start" letter-spacing="1.6">FIG. 6</text><text class="r" x="40.0" y="80.0" font-size="25" font-weight="600" fill="#23201b" text-anchor="start">TLP: recover a lost tail in ~2 ms, not 200 ms</text><text class="s" x="40.0" y="102.0" font-size="13.5" font-weight="400" fill="#6e675b" text-anchor="start">The last segment has no later segment to reveal its loss. A probe makes the receiver answer.</text><line x1="40.0" y1="118.0" x2="920.0" y2="118.0" stroke="#c9bea9" stroke-width="1"/><line x1="200.0" y1="190.0" x2="900.0" y2="190.0" stroke="#c9bea9" stroke-width="1"/><text class="s" x="176.0" y="194.0" font-size="11" font-weight="600" fill="#2e6a4f" text-anchor="end" letter-spacing="1.6">WITH TLP</text><g class="k1 loop"><circle cx="210" cy="190" r="6" fill="#cf4520"/><text class="s" x="210.0" y="174.0" font-size="12" font-weight="600" fill="#cf4520" text-anchor="middle">last segment lost</text></g><line x1="200.0" y1="290.0" x2="900.0" y2="290.0" stroke="#c9bea9" stroke-width="1"/><text class="s" x="176.0" y="294.0" font-size="11" font-weight="600" fill="#6e675b" text-anchor="end" letter-spacing="1.6">RTO ONLY</text><g class="k2 loop"><circle cx="210" cy="290" r="6" fill="#cf4520"/><text class="s" x="210.0" y="274.0" font-size="12" font-weight="600" fill="#cf4520" text-anchor="middle">last segment lost</text></g><rect class="k3 loop" x="210.0" y="202.0" width="170.0" height="8" fill="#2e6a4f" style="transform-box:fill-box;transform-origin:left center"/><g class="k4 loop"><text class="m" x="210.0" y="230.0" font-size="12" font-weight="600" fill="#2e6a4f" text-anchor="start">PTO = 2·SRTT + 2 ms</text></g><g class="k5 loop"><circle cx="380" cy="190" r="6" fill="#b47a12"/><text class="s" x="380.0" y="174.0" font-size="12" font-weight="600" fill="#b47a12" text-anchor="middle">resend last segment</text></g><g class="k6 loop"><circle cx="470" cy="190" r="6" fill="#2e6a4f"/><text class="s" x="486.0" y="195.0" font-size="12.5" font-weight="700" fill="#2e6a4f" text-anchor="start">duplicate → Linux ACKs at once → recovered</text></g><rect class="k7 loop" x="210.0" y="302.0" width="690.0" height="8" fill="#c9bea9" style="transform-box:fill-box;transform-origin:left center"/><g class="k8 loop"><text class="s" x="900.0" y="330.0" font-size="12" font-weight="600" fill="#6e675b" text-anchor="end">the RTO fires at 200 ms</text></g><line x1="40.0" y1="356.0" x2="920.0" y2="356.0" stroke="#c9bea9" stroke-width="1"/><text class="s" x="40.0" y="382.0" font-size="12.5" font-weight="400" fill="#23201b" text-anchor="start">Found with tcpdump: a probe with new data is in order, so Linux can hold its ACK for up to 200 ms.</text><text class="s" x="40.0" y="402.0" font-size="12.5" font-weight="600" fill="#cf4520" text-anchor="start">ustack probes with a duplicate.  At 5% loss: 27.0 s → 15.7 s.  At 1% loss: 1.06 s → 0.47 s.</text></svg>
