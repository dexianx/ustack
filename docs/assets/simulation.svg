<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="Deterministic simulation: two stacks over a hostile, seeded virtual network"><style>.s{font-family:'Avenir Next','Segoe UI Variable','Segoe UI','Helvetica Neue',sans-serif}.r{font-family:'Iowan Old Style','Charter','Bitstream Charter','Palatino Linotype',Georgia,serif}.m{font-family:'SF Mono','JetBrains Mono','Cascadia Code',Menlo,Consolas,monospace}@keyframes k1{0.000%{opacity:0}0.000%{opacity:0}1.250%{opacity:1}17.500%{opacity:1}18.750%{opacity:0}100.000%{opacity:0}}.k1{animation:k1 12s linear infinite}@keyframes k2{0.000%{opacity:0}20.000%{opacity:0}21.250%{opacity:1}37.500%{opacity:1}38.750%{opacity:0}100.000%{opacity:0}}.k2{animation:k2 12s linear infinite}@keyframes k3{0.000%{opacity:0}40.000%{opacity:0}41.250%{opacity:1}57.500%{opacity:1}58.750%{opacity:0}100.000%{opacity:0}}.k3{animation:k3 12s linear infinite}@keyframes k4{0.000%{opacity:0}60.000%{opacity:0}61.250%{opacity:1}77.500%{opacity:1}78.750%{opacity:0}100.000%{opacity:0}}.k4{animation:k4 12s linear infinite}@keyframes k5{0.000%{opacity:0}80.000%{opacity:0}81.250%{opacity:1}97.500%{opacity:1}98.750%{opacity:0}100.000%{opacity:0}}.k5{animation:k5 12s linear infinite}@keyframes k6{0.000%{transform:translate(200px,205px);opacity:0}2.500%{transform:translate(200px,205px);opacity:0}3.333%{transform:translate(200px,205px);opacity:1}14.167%{transform:translate(744px,205px);opacity:1}15.000%{transform:translate(744px,205px);opacity:0}100.000%{transform:translate(744px,205px);opacity:0}}.k6{animation:k6 12s cubic-bezier(.22,1,.36,1) infinite}@keyframes k7{0.000%{transform:translate(200px,205px);opacity:0}12.500%{transform:translate(200px,205px);opacity:0}13.333%{transform:translate(200px,205px);opacity:1}19.167%{transform:translate(470px,205px);opacity:1}25.000%{transform:translate(470px,255px);opacity:0}100.000%{transform:translate(470px,255px);opacity:0}}.k7{animation:k7 12s cubic-bezier(.22,1,.36,1) infinite}@keyframes k8{0.000%{opacity:0}15.833%{opacity:0}18.333%{opacity:1}21.667%{opacity:1}24.167%{opacity:0}100.000%{opacity:0}}.k8{animation:k8 12s linear infinite}@keyframes k9{0.000%{transform:translate(200px,205px);opacity:0}24.167%{transform:translate(200px,205px);opacity:0}25.000%{transform:translate(200px,205px);opacity:1}35.833%{transform:translate(744px,205px);opacity:1}36.667%{transform:translate(744px,205px);opacity:0}100.000%{transform:translate(744px,205px);opacity:0}}.k9{animation:k9 12s cubic-bezier(.22,1,.36,1) infinite}@keyframes k10{0.000%{transform:translate(470px,205px);opacity:0}30.000%{transform:translate(470px,205px);opacity:0}30.417%{transform:translate(470px,231px);opacity:1}36.250%{transform:translate(744px,231px);opacity:1}37.083%{transform:translate(744px,231px);opacity:0}100.000%{transform:translate(744px,231px);opacity:0}}.k10{animation:k10 12s cubic-bezier(.22,1,.36,1) infinite}@keyframes k11{0.000%{opacity:0}27.500%{opacity:0}30.000%{opacity:1}33.333%{opacity:1}35.833%{opacity:0}100.000%{opacity:0}}.k11{animation:k11 12s linear infinite}@keyframes k12{0.000%{transform:translate(200px,205px);opacity:0}35.833%{transform:translate(200px,205px);opacity:0}36.667%{transform:translate(200px,205px);opacity:1}47.500%{transform:translate(744px,205px);opacity:1}50.833%{transform:translate(744px,205px);opacity:0}100.000%{transform:translate(744px,205px);opacity:0}}.k12{animation:k12 12s cubic-bezier(.22,1,.36,1) infinite}@keyframes k13{0.000%{opacity:0}39.167%{opacity:0}41.667%{opacity:1}45.000%{opacity:1}47.500%{opacity:0}100.000%{opacity:0}}.k13{animation:k13 12s linear infinite}@keyframes k14{0.000%{transform:translate(200px,205px);opacity:0}49.167%{transform:translate(200px,205px);opacity:0}50.000%{transform:translate(200px,205px);opacity:1}54.167%{transform:translate(470px,173px);opacity:1}63.333%{transform:translate(470px,173px);opacity:1}69.167%{transform:translate(744px,205px);opacity:1}70.000%{transform:translate(744px,205px);opacity:0}100.000%{transform:translate(744px,205px);opacity:0}}.k14{animation:k14 12s cubic-bezier(.22,1,.36,1) infinite}@keyframes k15{0.000%{opacity:0}52.500%{opacity:0}55.000%{opacity:1}58.333%{opacity:1}60.833%{opacity:0}100.000%{opacity:0}}.k15{animation:k15 12s linear infinite}@keyframes k16{0.000%{transform:translate(200px,205px);opacity:0}55.000%{transform:translate(200px,205px);opacity:0}55.833%{transform:translate(200px,205px);opacity:1}66.667%{transform:translate(744px,205px);opacity:1}67.500%{transform:translate(744px,205px);opacity:0}100.000%{transform:translate(744px,205px);opacity:0}}.k16{animation:k16 12s cubic-bezier(.22,1,.36,1) infinite}@keyframes k17{0.000%{opacity:.4}8.333%{opacity:.4}10.833%{opacity:1}21.667%{opacity:1}25.000%{opacity:.4}100.000%{opacity:.4}}.k17{animation:k17 12s linear infinite}@keyframes k18{0.000%{opacity:.4}28.333%{opacity:.4}30.833%{opacity:1}41.667%{opacity:1}45.000%{opacity:.4}100.000%{opacity:.4}}.k18{animation:k18 12s linear infinite}@keyframes k19{0.000%{opacity:.4}48.333%{opacity:.4}50.833%{opacity:1}61.667%{opacity:1}65.000%{opacity:.4}100.000%{opacity:.4}}.k19{animation:k19 12s linear infinite}@keyframes k20{0.000%{opacity:.4}68.333%{opacity:.4}70.833%{opacity:1}81.667%{opacity:1}85.000%{opacity:.4}100.000%{opacity:.4}}.k20{animation:k20 12s linear infinite}@media (prefers-reduced-motion:reduce){.loop{animation-play-state:paused!important;animation-delay:-4.6s!important}.once{animation:none!important}}</style><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#d9cfbe"/></pattern><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#d9cfbe" stroke-width="1.2"/></pattern></defs><rect width="960" height="500" fill="#f4efe6"/><rect width="960" height="500" fill="url(#dots)"/><path d="M14 28V14H28" fill="none" stroke="#6e675b" stroke-width="1"/><path d="M946 28V14H932" fill="none" stroke="#6e675b" stroke-width="1"/><path d="M14 472V486H28" fill="none" stroke="#6e675b" stroke-width="1"/><path d="M946 472V486H932" fill="none" stroke="#6e675b" stroke-width="1"/><text class="s" x="40.0" y="50.0" font-size="10.5" font-weight="600" fill="#cf4520" text-anchor="start" letter-spacing="1.6">FIG. 8</text><text class="r" x="40.0" y="80.0" font-size="25" font-weight="600" fill="#23201b" text-anchor="start">How we know it works</text><text class="s" x="40.0" y="102.0" font-size="13.5" font-weight="400" fill="#6e675b" text-anchor="start">Two stacks in one process. Virtual time. A seeded link that loses, duplicates, corrupts and reorders.</text><line x1="40.0" y1="118.0" x2="920.0" y2="118.0" stroke="#c9bea9" stroke-width="1"/><rect x="40.0" y="150.0" width="150.0" height="120.0" rx="1.5" fill="#f4efe6" stroke="#23201b" stroke-width="1.2"/><text class="r" x="115.0" y="205.0" font-size="17" font-weight="600" fill="#23201b" text-anchor="middle">stack A</text><text class="s" x="115.0" y="225.0" font-size="11.5" font-weight="400" fill="#6e675b" text-anchor="middle">client</text><rect x="770.0" y="150.0" width="150.0" height="120.0" rx="1.5" fill="#f4efe6" stroke="#23201b" stroke-width="1.2"/><text class="r" x="845.0" y="205.0" font-size="17" font-weight="600" fill="#23201b" text-anchor="middle">stack B</text><text class="s" x="845.0" y="225.0" font-size="11.5" font-weight="400" fill="#6e675b" text-anchor="middle">echo server</text><rect x="230" y="150" width="500" height="120" fill="url(#hatch)"/><rect x="230.0" y="150.0" width="500.0" height="120.0" rx="1.5" fill="none" stroke="#b47a12" stroke-width="1.2" stroke-dasharray="5 4"/><text class="s" x="244.0" y="170.0" font-size="10.5" font-weight="600" fill="#b47a12" text-anchor="start" letter-spacing="1.6">SEEDED LINK</text><g class="k1 loop"><text class="m" x="716.0" y="170.0" font-size="11.5" font-weight="600" fill="#6e675b" text-anchor="end">seed 1</text></g><g class="k2 loop"><text class="m" x="716.0" y="170.0" font-size="11.5" font-weight="600" fill="#6e675b" text-anchor="end">seed 2</text></g><g class="k3 loop"><text class="m" x="716.0" y="170.0" font-size="11.5" font-weight="600" fill="#6e675b" text-anchor="end">seed 3</text></g><g class="k4 loop"><text class="m" x="716.0" y="170.0" font-size="11.5" font-weight="600" fill="#6e675b" text-anchor="end">…</text></g><g class="k5 loop"><text class="m" x="716.0" y="170.0" font-size="11.5" font-weight="600" fill="#6e675b" text-anchor="end">seed 100,000</text></g><g class="k6 loop"><rect width="26" height="12" rx="1" fill="#cf4520"/></g><g class="k7 loop"><rect width="26" height="12" rx="1" fill="#cf4520"/></g><g class="k8 loop"><text class="s" x="480.0" y="296.0" font-size="12.5" font-weight="700" fill="#cf4520" text-anchor="middle">lost</text></g><g class="k9 loop"><rect width="26" height="12" rx="1" fill="#cf4520"/></g><g class="k10 loop"><rect width="26" height="12" rx="1" fill="#cf4520"/></g><g class="k11 loop"><text class="s" x="480.0" y="296.0" font-size="12.5" font-weight="700" fill="#cf4520" text-anchor="middle">duplicated</text></g><g class="k12 loop"><rect width="26" height="12" rx="1" fill="#b47a12"/></g><g class="k13 loop"><text class="s" x="480.0" y="296.0" font-size="12.5" font-weight="700" fill="#b47a12" text-anchor="middle">one bit flipped → checksum rejects it</text></g><g class="k14 loop"><rect width="26" height="12" rx="1" fill="#2c4a78"/></g><g class="k15 loop"><text class="s" x="480.0" y="296.0" font-size="12.5" font-weight="700" fill="#2c4a78" text-anchor="middle">delayed → arrives after the next one</text></g><g class="k16 loop"><rect width="26" height="12" rx="1" fill="#cf4520"/></g><text class="s" x="40.0" y="340.0" font-size="10.5" font-weight="600" fill="#23201b" text-anchor="start" letter-spacing="1.6">CHECKED AFTER EVERY EVENT</text><line x1="40.0" y1="350.0" x2="440.0" y2="350.0" stroke="#23201b" stroke-width="1"/><g class="k17 loop"><text class="s" x="40.0" y="378.0" font-size="14" font-weight="700" fill="#2e6a4f" text-anchor="start">✓</text><text class="s" x="62.0" y="378.0" font-size="13" font-weight="400" fill="#23201b" text-anchor="start">the send queue has no gaps</text></g><g class="k18 loop"><text class="s" x="40.0" y="404.0" font-size="14" font-weight="700" fill="#2e6a4f" text-anchor="start">✓</text><text class="s" x="62.0" y="404.0" font-size="13" font-weight="400" fill="#23201b" text-anchor="start">SACK and loss counters match a recount</text></g><g class="k19 loop"><text class="s" x="40.0" y="430.0" font-size="14" font-weight="700" fill="#2e6a4f" text-anchor="start">✓</text><text class="s" x="62.0" y="430.0" font-size="13" font-weight="400" fill="#23201b" text-anchor="start">out-of-order ranges stay sorted</text></g><g class="k20 loop"><text class="s" x="40.0" y="456.0" font-size="14" font-weight="700" fill="#2e6a4f" text-anchor="start">✓</text><text class="s" x="62.0" y="456.0" font-size="13" font-weight="400" fill="#23201b" text-anchor="start">every echoed byte matches what was sent</text></g><text class="s" x="520.0" y="340.0" font-size="10.5" font-weight="600" fill="#23201b" text-anchor="start" letter-spacing="1.6">ONE SWEEP, ABOUT TWO MINUTES</text><line x1="520.0" y1="350.0" x2="920.0" y2="350.0" stroke="#23201b" stroke-width="1"/><text class="s" x="520.0" y="378.0" font-size="13" font-weight="400" fill="#23201b" text-anchor="start">randomized connections</text><line x1="681.8" y1="375.0" x2="833.6" y2="375.0" stroke="#c9bea9" stroke-width="1.2" stroke-dasharray="1 4"/><text class="r" x="920.0" y="378.0" font-size="21" font-weight="600" fill="#23201b" text-anchor="end">100,000</text><text class="s" x="520.0" y="404.0" font-size="13" font-weight="400" fill="#23201b" text-anchor="start">data echoed and verified</text><line x1="695.6" y1="401.0" x2="833.6" y2="401.0" stroke="#c9bea9" stroke-width="1.2" stroke-dasharray="1 4"/><text class="r" x="920.0" y="404.0" font-size="21" font-weight="600" fill="#23201b" text-anchor="end">72.7 GB</text><text class="s" x="520.0" y="430.0" font-size="13" font-weight="400" fill="#23201b" text-anchor="start">segments exchanged</text><line x1="654.2" y1="427.0" x2="856.0" y2="427.0" stroke="#c9bea9" stroke-width="1.2" stroke-dasharray="1 4"/><text class="r" x="920.0" y="430.0" font-size="21" font-weight="600" fill="#23201b" text-anchor="end">80.2M</text><text class="s" x="520.0" y="456.0" font-size="13" font-weight="400" fill="#23201b" text-anchor="start">failures</text><line x1="585.2" y1="453.0" x2="900.8" y2="453.0" stroke="#c9bea9" stroke-width="1.2" stroke-dasharray="1 4"/><text class="r" x="920.0" y="456.0" font-size="21" font-weight="600" fill="#cf4520" text-anchor="end">0</text></svg>
